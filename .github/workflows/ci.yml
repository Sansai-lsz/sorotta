name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@24
          cache: true
          # PR のジョブにはストアのキャッシュを書かせない
          save-cache: ${{ github.event_name == 'push' }}
          require-lockfile: true

      - run: pnpm run fmt:check
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Bundle without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir dist

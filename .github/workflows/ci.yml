name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      # 認証なしで動く dry-run で、Worker として組み立てられることだけを確かめる（デプロイはしない）
      - name: Worker のビルド確認
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry
        env:
          WRANGLER_SEND_METRICS: "false"

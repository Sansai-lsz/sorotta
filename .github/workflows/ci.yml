name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          # PR のジョブにはストアのキャッシュを書かせない
          save-cache: ${{ github.event_name == 'push' }}
          require-lockfile: true

      - run: pnpm run fmt:check
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Bundle without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir dist
